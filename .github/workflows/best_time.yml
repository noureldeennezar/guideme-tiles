name: Update best-time data (automatic)

on:
  schedule:
    - cron: "17 5 * * 1"    # every Monday 05:17 UTC (only new destinations are fetched, so it is quick)
  workflow_dispatch: {}     # press "Run workflow" once to create the file right now

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the scoring
        run: python scripts/build_best_time.py --selftest
      - name: Build best_time/best_time.json (NASA POWER climate averages)
        run: python scripts/build_best_time.py
      - name: Save if changed
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add best_time/best_time.json
          git diff --cached --quiet || git commit -m "Update best-time data"
          git push
