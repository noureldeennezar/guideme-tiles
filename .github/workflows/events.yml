name: Update events (weekly, automatic)

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build events.json from Wikidata
        run: python scripts/build_events.py --out events/events.json
      - name: Save if changed
        run: |
          git config user.name "events-bot"
          git config user.email "events-bot@users.noreply.github.com"
          git add events/events.json
          git diff --cached --quiet || git commit -m "Update events"
          git push
